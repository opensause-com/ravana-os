name: Publish ISO to Cloudflare R2

# Sends ISOs from an earlier "Build Ravana OS live ISO" run to R2 without rebuilding.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID of the live ISO build (the number in its URL)
        required: true
      channel:
        description: Folder in the bucket
        type: choice
        options: [testing, latest, shell]
        default: testing
      artifact_name:
        description: Artifact to publish (empty = the usual *-live-iso)
        required: false
        default: ''
      make_room:
        description: Delete the older ISO in this folder first if the bucket would pass its free limit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact_name || '' }}
          pattern: ${{ inputs.artifact_name == '' && '*-live-iso' || '' }}
          merge-multiple: true
          path: output
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: |
          ls -lh output
          cd output && sha256sum -c *.sha256

      - name: Upload to Cloudflare R2
        env:
          MAKE_ROOM: ${{ inputs.make_room }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_CHANNEL: ${{ vars.R2_CHANNEL }}
          R2_EDITIONS: ${{ vars.R2_EDITIONS }}${{ inputs.artifact_name != '' && ' ravana-os-nobara' || '' }}
          CHANNEL_IN: ${{ inputs.channel }}
        run: |
          if [ "$MAKE_ROOM" = true ]; then
            export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
            EP=(--endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com")
            for k in ravana-os-live.iso ravana-os-live.iso.sha256; do
              echo "making room: removing $CHANNEL_IN/$k"; aws s3 rm "${EP[@]}" "s3://$R2_BUCKET/$CHANNEL_IN/$k" || true
            done
          fi
          scripts/r2-upload.sh "$CHANNEL_IN" output/*-live.iso
