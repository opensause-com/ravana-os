name: Build Ravana OS ISO (Kubuntu base)

# Remixes the official Kubuntu 26.04.1 ISO: adds Quickshell (built here), Ravana Shell and the gaming stack.
on:
  push:
    branches: [ravana-kubuntu]
    paths: [kubuntu/**, system_files/**, .github/workflows/build-kubuntu-iso.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBUNTU_URL: https://cdimage.ubuntu.com/kubuntu/releases/26.04.1/release/kubuntu-26.04.1-desktop-amd64.iso
  KUBUNTU_SHA256: 831e4d4bb85098339ba43d3502cd6619b27e76daf37246a084cd68a6413090b8
  QUICKSHELL_TAG: v0.3.2

jobs:
  quickshell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Quickshell for Ubuntu 26.04
        run: |
          docker run --rm -v "$PWD:/w" -e QS_TAG="$QUICKSHELL_TAG" ubuntu:26.04 \
            bash -euxo pipefail -c 'bash /w/kubuntu/build-quickshell.sh "$QS_TAG" /w/quickshell.tar.gz'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickshell-ubuntu
          path: quickshell.tar.gz
          retention-days: 7

  iso:
    needs: quickshell
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: quickshell-ubuntu
          path: .

      - name: Get the official ISO and check it
        run: |
          curl -fL --retry 5 -o kubuntu.iso "$KUBUNTU_URL"
          echo "$KUBUNTU_SHA256  kubuntu.iso" | sha256sum -c -

      - name: Remix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools >/dev/null
          sudo mkdir -p /mnt/remix && sudo chown "$USER" /mnt/remix
          mkdir -p out
          sudo WORKDIR=/mnt/remix bash kubuntu/remix.sh kubuntu.iso quickshell.tar.gz "$PWD/out/ravana-os-kubuntu-live.iso"
          cd out && sha256sum ravana-os-kubuntu-live.iso > ravana-os-kubuntu-live.iso.sha256
          ls -lh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ravana-kubuntu-iso
          path: out/
          retention-days: 7
