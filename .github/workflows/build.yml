name: Build Ravana OS image

on:
  push:
    branches: [main, testing, ravana-shell]   # main -> :latest, testing -> :testing, ravana-shell -> :shell
    # Every push becomes an update for installed PCs on that channel. The fast lane in
    # screenshot.yml still shows UI changes within ~10 minutes while this builds.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/**'
      - 'disk_config/**'
      - '.github/workflows/build-iso.yml'
      - '.github/workflows/analyze.yml'
      - '.github/workflows/build-live-iso.yml'
      - '.github/workflows/publish-iso-sourceforge.yml'
      - 'scripts/**'
      - '.github/screenshot/**'
      - '.github/workflows/screenshot.yml'
      - 'live/**'
      - 'Containerfile.live'
  pull_request:
    branches: [main, testing]
  schedule:
    - cron: '30 6 * * 6'   # weekly (Saturday): stable gets one tested update a week
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ravana OS: gaming + desktop + Game Mode; dev stack removed (smallest).
          # Same base as Developer, so switching editions only downloads the difference.
          - image: ravana-os
            base: ghcr.io/ublue-os/bazzite-dx:stable
            flavor: main
          - image: ravana-os-nvidia
            base: ghcr.io/ublue-os/bazzite-dx-nvidia:stable
            flavor: main
          # Ravana OS Developer: + VS Code, Docker, VMs, ROCm (Bazzite DX base)
          - image: ravana-os-dx
            base: ghcr.io/ublue-os/bazzite-dx:stable
            flavor: dx
          - image: ravana-os-dx-nvidia
            base: ghcr.io/ublue-os/bazzite-dx-nvidia:stable
            flavor: dx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space (base image is ~15 GB unpacked)
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Prepare tags
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          D=$(date -u +%Y%m%d); S=${GITHUB_SHA::7}
          if [ "$GITHUB_REF_NAME" = testing ]; then
            echo "BUILD_TAG=testing-$D-$S" >> "$GITHUB_ENV"
            echo "TAGS=testing testing-$D" >> "$GITHUB_ENV"                 # test machines
          elif [ "$GITHUB_REF_NAME" = ravana-shell ]; then
            echo "BUILD_TAG=shell-$D-$S" >> "$GITHUB_ENV"
            echo "TAGS=shell" >> "$GITHUB_ENV"                              # Ravana Shell preview
          else
            echo "BUILD_TAG=$D-$S" >> "$GITHUB_ENV"
            echo "TAGS=latest $D" >> "$GITHUB_ENV"                          # everyone
          fi

      - name: Build image
        run: |
          sudo podman build --pull=newer \
            --build-arg BASE_IMAGE=${{ matrix.base }} \
            --build-arg IMAGE_NAME=${{ matrix.image }} \
            --build-arg IMAGE_VENDOR=${{ github.repository_owner }} \
            --build-arg IMAGE_FLAVOR=${{ matrix.flavor }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$(date -u +%Y%m%d)-${GITHUB_SHA::7}" \
            -t localhost/${{ matrix.image }}:latest -f Containerfile .

      # Re-split the image into package-based layers so updates only download
      # what actually changed (usually a few hundred MB instead of GBs).
      - name: Rechunk for small updates
        run: |
          GRAPHROOT="$(sudo podman info --format '{{.Store.GraphRoot}}')"
          sudo podman run --rm --pull=never --privileged \
            --mount=type=image,src=localhost/${{ matrix.image }}:latest,target=/rpm-ostree \
            --mount=type=bind,src="$GRAPHROOT",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            localhost/${{ matrix.image }}:latest \
            compose build-chunked-oci --max-layers 127 --format-version=2 --bootc \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/${{ matrix.image }}:latest"

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Unique tag first; channel tags move only after the signature is verified
          sudo podman push --digestfile=/tmp/digest localhost/${{ matrix.image }}:latest "$IMAGE_REGISTRY/${{ matrix.image }}:$BUILD_TAG"
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # Installed systems only accept updates signed with this key (cosign.pub).
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE_REGISTRY/${{ matrix.image }}@$DIGEST"
          cosign verify --key cosign.pub --insecure-ignore-tlog=false \
            "$IMAGE_REGISTRY/${{ matrix.image }}@$DIGEST" > /dev/null && echo "Signature verified"

      - name: Publish channel tags
        if: github.event_name != 'pull_request'
        run: |
          for tag in $TAGS; do
            sudo podman push localhost/${{ matrix.image }}:latest "$IMAGE_REGISTRY/${{ matrix.image }}:$tag"
          done
          echo "Published $TAGS -> $DIGEST"
