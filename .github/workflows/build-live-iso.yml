name: Build Ravana OS live ISO

# A live USB that boots straight into Ravana (try without installing) with an
# "Install Ravana OS" button. The system image is embedded in the ISO, so installing
# needs no internet connection.
#
# Runs:
#   - automatically after a stable (main) image build that came from a push,
#     then publishes a GitHub Release
#   - weekly, to refresh the ISOs with upstream fixes (also released)
#   - automatically after a testing image build from a push (testing ISO, no release)
#   - manually from the Actions tab (any edition/channel, no release)
#
# ISOs go to SourceForge (fast mirrors, direct .iso links) once the repo variables
# SF_PROJECT and SF_USER and the secret SF_SSH_KEY are set. They are also kept as
# build artifacts.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Edition
        type: choice
        options: [ravana-os, ravana-os-nvidia]
        default: ravana-os
      channel:
        description: Image channel
        type: choice
        options: [latest, testing, shell]
        default: latest
      sourceforge:
        description: Upload to Cloudflare R2 / SourceForge (when set up)
        type: boolean
        default: true
  workflow_run:
    workflows: ["Build Ravana OS image"]
    types: [completed]
    branches: [main, testing]
  schedule:
    - cron: '0 8 * * 0'   # Sundays

concurrency:
  group: live-iso-${{ github.event_name }}-${{ inputs.image || 'all' }}-${{ inputs.channel || github.event.workflow_run.head_branch || 'latest' }}
  # A failed or skipped image build must not cancel an ISO build that is already running
  cancel-in-progress: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

env:
  CHANNEL: ${{ inputs.channel || (github.event.workflow_run.head_branch == 'testing' && 'testing') || 'latest' }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
    steps:
      - id: s
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  live-iso:
    needs: meta
    # Automatic runs only after successful stable builds triggered by a push
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.image) || '["ravana-os","ravana-os-nvidia"]') }}
    env:
      SF_PROJECT: ${{ vars.SF_PROJECT }}
      ISO: ${{ matrix.image }}-live.iso
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Put container storage on the big /mnt disk
        run: |
          sudo mkdir -p /mnt/containers
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers"\nrunroot = "/run/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf
          df -h / /mnt

      - name: Build live image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="ghcr.io/$OWNER/${{ matrix.image }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$REPO:$CHANNEL"
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE="$REPO:$CHANNEL" \
            --build-arg RAVANA_IMAGE="$REPO" \
            --build-arg RAVANA_TAG="$CHANNEL" \
            -t localhost/ravana-live:latest -f Containerfile.live .
          df -h / /mnt

      # Proof that the USB can install with no internet: run the live system with the
      # network switched off and do what the installer does (read the embedded OS image
      # and deploy it to an empty disk folder). The live session's root is an overlay
      # filesystem, and so is a container's, so the embedded image is read the same way.
      # An ISO that can't install offline is not published: a failure stops the build.
      # The result and the last lines of the log are in the run summary.
      - name: Offline install check (network off)
        id: offline
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REF="ghcr.io/$OWNER/${{ matrix.image }}:$CHANNEL"
          sudo mkdir -p /mnt/offline-target
          set +e
          sudo podman run --rm --network=none --privileged --security-opt label=disable \
            -v /mnt/offline-target:/target -e REF="$REF" \
            localhost/ravana-live:latest bash -c '
              set -x
              echo "== tools"; command -v fuse-overlayfs skopeo ostree bootc
              echo "== root filesystem: $(stat -f -c %T /var/lib/containers/storage)"
              echo "== 1. is the OS image on the USB?"
              podman images || exit 11
              podman image exists "$REF" || exit 12
              echo "== 2. can it be read without a network?"
              skopeo inspect --no-tags "containers-storage:$REF" >/dev/null || exit 13
              echo "== 3. the installer'"'"'s own step: deploy it to an empty disk"
              ostree admin init-fs --modern /target || exit 14
              ostree config --repo=/target/ostree/repo set sysroot.bootloader none
              ostree config --repo=/target/ostree/repo set sysroot.bootprefix true
              ostree admin --sysroot=/target os-init default || exit 15
              ostree container image deploy --sysroot=/target --image="$REF" \
                --transport=containers-storage --stateroot=default --no-signature-verification || exit 16
              ls /target/ostree/deploy/default/deploy
              df -h /target /var/tmp
            ' 2>&1 | tee /tmp/offline-check.log
          rc=${PIPESTATUS[0]}
          set -e
          # deployed systems are marked unchangeable; clear that before removing the test disk
          sudo chattr -R -i /mnt/offline-target 2>/dev/null || true
          sudo rm -rf /mnt/offline-target || true
          df -h /mnt
          {
            echo "### Offline install check: ${{ matrix.image }}"
            case "$rc" in
              0)  echo "Passed: the embedded OS image deployed with the network off." ;;
              11|12) echo "FAILED: the OS image is not in the live system (step 1, code $rc)." ;;
              13) echo "FAILED: the embedded OS image cannot be read offline (step 2)." ;;
              *)  echo "FAILED at the installer's deploy step (code $rc)." ;;
            esac
            echo; echo '```'; tail -40 /tmp/offline-check.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || { echo "::error::Offline install check failed (code $rc): see the run summary"; exit 1; }

      - name: Prepare output folder
        run: mkdir -p output

      - name: Build ISO (Titanoboa)
        id: iso
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/ravana-live:latest
          iso-dest: ${{ github.workspace }}/output/${{ matrix.image }}-live.iso

      # Titanoboa resolves iso-dest relative to its own folder; collect it from its output
      - name: Collect ISO
        run: |
          SRC="${{ steps.iso.outputs.iso-dest }}"
          [ -f "$SRC" ] || SRC="$(find "$GITHUB_WORKSPACE/.." -name "$ISO" -size +1G 2>/dev/null | head -1)"
          echo "ISO at: $SRC"
          [ "$(realpath "$SRC")" = "$(realpath -m "output/$ISO")" ] || mv "$SRC" "output/$ISO"
          ls -lh output

      # A real boot of the ISO: does the live session reach the desktop, and what does it
      # download by itself? (It installs from the USB, so the answer should be: next to nothing.)
      # Reports only; the numbers and server names are in the run summary.
      - name: Boot the ISO and measure network use
        continue-on-error: true
        run: |
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 ovmf tshark imagemagick xorriso >/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          scripts/live-boot-check.sh "output/$ISO" boot-check 420
          cat boot-check/network.md >> "$GITHUB_STEP_SUMMARY"
          rm -f boot-check/monitor.sock

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.image }}-boot-check
          path: boot-check
          if-no-files-found: ignore
          retention-days: 14

      - name: Checksum and inspect
        run: |
          cd output
          sha256sum "$ISO" > "$ISO.sha256"
          ls -lh
          sudo apt-get install -y -qq xorriso >/dev/null
          xorriso -indev "$ISO" -pvd_info 2>/dev/null | grep -iE "volume id" || true
          xorriso -osirrox on -indev "$ISO" -extract /boot/grub2/grub.cfg /tmp/grub.cfg 2>/dev/null \
            || xorriso -osirrox on -indev "$ISO" -extract /EFI/BOOT/grub.cfg /tmp/grub.cfg 2>/dev/null || true
          grep -E "menuentry|search" /tmp/grub.cfg 2>/dev/null || true

      - name: Upload to Cloudflare R2
        # Only the AMD/Intel ISO goes to R2 (keeps the bucket inside the free 10 GB)
        if: vars.R2_BUCKET != '' && matrix.image == 'ravana-os' && (github.event_name != 'workflow_dispatch' || inputs.sourceforge)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_CHANNEL: ${{ vars.R2_CHANNEL }}
          R2_EDITIONS: ${{ vars.R2_EDITIONS }}
        run: scripts/r2-upload.sh "$CHANNEL" "output/$ISO"

      - name: Upload to SourceForge
        if: env.SF_PROJECT != '' && (github.event_name != 'workflow_dispatch' || inputs.sourceforge)
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
          SF_USER: ${{ vars.SF_USER }}
        run: scripts/sourceforge-upload.sh "$CHANNEL" "${{ needs.meta.outputs.stamp }}" "output/$ISO"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-live-iso
          path: |
            output/${{ matrix.image }}-live.iso
            output/${{ matrix.image }}-live.iso.sha256
          compression-level: 0
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 90 }}

      # Small checksum file for the release job
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-sha256
          path: output/${{ matrix.image }}-live.iso.sha256
          retention-days: 90

  release:
    needs: [meta, live-iso]
    if: github.event_name != 'workflow_dispatch' && github.event.workflow_run.head_branch != 'testing'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sha256'
          merge-multiple: true
          path: checksums

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^ARG IMAGE_VERSION=//p' Containerfile)"
          STAMP="${{ needs.meta.outputs.stamp }}"
          DATE="${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2}"
          TAG="v${VERSION}-${STAMP}"
          SF="${{ vars.SF_PROJECT }}"
          SF_DIR="https://sourceforge.net/projects/$SF/files/releases/$VERSION-$STAMP"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat checksums/*.sha256 > SHA256SUMS
          # SourceForge files carry the version and date in their names
          [ -z "$SF" ] || sed -Ei "s/ (ravana-os[a-z-]*)-live\.iso$/ \1-$VERSION-$STAMP-live.iso/" SHA256SUMS
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            echo "## Download"
            echo
            echo "Live USB: try Ravana without installing, then install (dual boot friendly)."
            echo
            echo "| Edition | Download |"
            echo "|---|---|"
            R2="${{ vars.R2_PUBLIC_URL }}"
            if [ -n "$R2" ]; then
              echo "| Ravana OS (AMD / Intel) | [ravana-os-live.iso]($R2/${{ vars.R2_CHANNEL || 'testing' }}/ravana-os-live.iso) (direct, no sign-in) |"
              echo "| Ravana OS (NVIDIA) | \`ravana-os-nvidia-live.iso\` from the [build page]($RUN_URL#artifacts) |"
              echo
              echo "Verify with \`SHA256SUMS\` below."
            elif [ -n "$SF" ]; then
              for e in "ravana-os:AMD / Intel" "ravana-os-nvidia:NVIDIA"; do
                f="${e%%:*}-$VERSION-$STAMP-live.iso"
                echo "| Ravana OS (${e#*:}) | [$f]($SF_DIR/$f/download) |"
              done
              echo
              echo "Direct downloads from SourceForge mirrors, no sign-in needed. Verify with \`SHA256SUMS\` below."
            else
              echo "| Ravana OS (AMD / Intel) | \`ravana-os-live.iso\` from the [build page]($RUN_URL#artifacts) |"
              echo "| Ravana OS (NVIDIA) | \`ravana-os-nvidia-live.iso\` from the [build page]($RUN_URL#artifacts) |"
              echo
              echo "Downloads are kept for 90 days and need a GitHub sign-in. Verify with \`SHA256SUMS\` below."
            fi
            echo "Want VS Code, Docker, VMs and ROCm? Open **Get Developer Tools** after installing."
            echo
            echo "Already on Ravana? Updates arrive automatically, or run \`ujust update\`."
            echo
            echo "## Images"
            echo
            echo "All images are signed with [cosign.pub](https://github.com/${{ github.repository }}/blob/main/cosign.pub):"
            echo "\`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ravana-os:latest\` · \`ravana-os-nvidia\` · \`ravana-os-dx\` · \`ravana-os-dx-nvidia\`"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" SHA256SUMS \
              --title "Ravana OS $VERSION ($DATE)" \
              --notes-file notes.md --generate-notes \
              ${PREV:+--notes-start-tag "$PREV"} \
              --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
              --latest
          fi
          echo "Released $TAG"
