name: Desktop screenshots

# Boots the Ravana desktop headless in the cloud and screenshots it, so UI changes
# can be checked without downloading or installing anything.
#
# Fast lane (push to ravana-shell): no image build. The last built :shell image is
# started with this commit's system_files laid over it, so shell/UI changes are on
# screen in ~10 minutes. A full image build runs only when asked for.
on:
  push:
    branches: [ravana-shell]
    paths:
      - 'system_files/**'
      - 'build_files/55-ravana-shell-config.sh'
      - '.github/screenshot/**'
      - '.github/workflows/screenshot.yml'
  workflow_run:
    workflows: ["Build Ravana OS image"]
    types: [completed]
    branches: [testing, ravana-shell]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: testing

jobs:
  screenshot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # job-level, so skipped runs (cancelled builds) never cancel a real one
    concurrency:
      group: screenshot-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Virtual GPU (vgem) so KWin has a render device
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          sudo modprobe vgem && ls -la /dev/dri || echo "vgem not available"

      - name: Screenshot the desktop
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ravana-os:${{ inputs.tag || ((github.event.workflow_run.head_branch == 'ravana-shell' || github.ref_name == 'ravana-shell') && 'shell') || 'testing' }}"
          sudo podman pull -q "$IMAGE"
          mkdir -p shots
          OVERLAY=()
          if [ "${{ github.event_name }}" = push ]; then
            echo "Fast lane: this commit's system_files over $IMAGE"
            OVERLAY=(-v "$PWD/system_files:/overlay:ro" -v "$PWD/build_files/55-ravana-shell-config.sh:/fastlane-config.sh:ro")
          fi
          sudo podman run --rm --privileged --security-opt label=disable --device /dev/dri \
            "${OVERLAY[@]}" -v "$PWD/shots:/shots" -v "$PWD/.github/screenshot/run.sh:/run.sh:ro" -v "$PWD/.github/screenshot/capture.py:/capture.py:ro" -v "$PWD/build_files/fedora-build.repo:/fedora-build.repo:ro" \
            "$IMAGE" bash /run.sh
          sudo chown -R "$USER" shots
          cat shots/steps.log || true
          tail -n 40 shots/kwin.log || true
          tail -n 60 shots/session.log || true
          grep -iE "ravana|error|qml|file:" shots/plasmashell.log | grep -v "^$" | head -60 || true
          cat shots/panels.txt || true

      # Small artifacts so checking a run is quick even on a slow connection:
      # logs (text), new-shell shots as compact JPEGs, and the full PNG set
      - name: Compact copies
        run: |
          mkdir -p logs shell-jpg
          find shots -maxdepth 1 -type f ! -name '*.png' -exec cp {} logs/ \;
          for f in shots/[23]*.png shots/0[15]*.png; do
            [ -f "$f" ] && convert "$f" -resize 1280x720 -quality 80 "shell-jpg/$(basename "${f%.png}").jpg"
          done
          du -sh logs shell-jpg shots
      - uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: shell-jpg
          path: shell-jpg
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: shots
          retention-days: 14
