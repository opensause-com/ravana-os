label: "RAVANA-OS"
grub2:
  default: 0
  timeout: 5
  entries:
    - name: "Try or Install Ravana OS"
      linux: "/images/pxeboot/vmlinuz quiet splash rhgb root=live:CDLABEL=RAVANA-OS enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Try or Install Ravana OS (Safe Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet splash rhgb root=live:CDLABEL=RAVANA-OS enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
