name: Boot-check Kubuntu-based ISO

# Boots an ISO built by "Build Ravana OS ISO (Nobara base)" in a VM and takes screenshots.
on:
  push:
    branches: [ravana-kubuntu]
    paths: [.github/workflows/check-kubuntu-iso.yml]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ravana-kubuntu-iso
          path: output
          run-id: '43599923122'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot it and look
        run: |
          ls -lh output
          scripts/live-boot-check.sh --install-tools
          scripts/live-boot-check.sh output/ravana-os-kubuntu-live.iso boot-check 480
          cat boot-check/network.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kubuntu-boot-check
          path: boot-check
          if-no-files-found: ignore
          retention-days: 14
