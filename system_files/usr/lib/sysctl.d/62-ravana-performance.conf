# Ravana OS performance. Safe for games, Docker and VMs; security settings live in
# 60-ravana-hardening.conf and are untouched.

# ---- Network: faster, steadier connections (BBR congestion control + fair queueing) ----
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# reuse TCP connection setup on repeat visits (client and server)
net.ipv4.tcp_fastopen = 3
# don't fall back to a slow start after a short pause (downloads, streaming)
net.ipv4.tcp_slow_start_after_idle = 0
# find the right packet size on links that block the usual probes (some ISPs, VPNs)
net.ipv4.tcp_mtu_probing = 1
# room for fast downloads (16 MB buffers) and bursts of packets
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 16384

# ---- Memory: compressed RAM swap (zram) first, so the desktop stays responsive ----
# zram is much faster than disk, so swapping to it early frees real RAM for apps
vm.swappiness = 180
vm.page-cluster = 0
# avoid stalls when memory runs short (no reclaim bursts)
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# keep file-name caches a little longer (snappier Files and Spotlight)
vm.vfs_cache_pressure = 50
