# Ravana OS: Mac keyboard shortcuts. Cmd = the Windows (Meta) key.
#
# Only Windows-key combinations change. Ctrl, Alt and every other key behave as
# usual, so Windows/Linux habits and games are unaffected.
# Turn off: sudo systemctl disable --now keyd
#
# Windows key + C/V copy/paste with Ctrl+Insert / Shift+Insert, which also work
# in terminals (where Ctrl+C would stop the running program).
#
# Left alone (handled by the desktop): Win+Space search, Win+Tab switch apps,
# Win+` switch windows of an app, Win+H hide, Win+M minimize, Win+E files,
# Win+Shift+3/4/5 screenshots, Win+Ctrl+Q lock, Win+Ctrl+F full screen,
# Win+Alt+Esc force quit, Win+Shift+Q log out, Win+. emoji.

[ids]
*

[main]

[meta]
a = C-a
b = C-b
c = C-insert
d = C-d
f = C-f
g = C-g
i = C-i
j = C-j
k = C-k
l = C-l
n = C-n
o = C-o
p = C-p
q = C-q
r = C-r
s = C-s
t = C-t
u = C-u
v = S-insert
w = C-w
x = C-x
y = C-y
z = C-z
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0
equal = C-equal
minus = C-minus
comma = C-comma
slash = C-slash
leftbrace = A-left
rightbrace = A-right
enter = C-enter
left = home
right = end
up = C-home
down = C-end

[meta+shift]
a = C-S-a
f = C-S-f
g = C-S-g
n = C-S-n
p = C-S-p
s = C-S-s
t = C-S-t
z = C-S-z
left = S-home
right = S-end
up = C-S-home
down = C-S-end
leftbrace = C-S-tab
rightbrace = C-tab

# Win+Alt and Win+Ctrl combinations pass through unchanged
[meta+alt]

[meta+control]
