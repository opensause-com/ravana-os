# Ravana OS: check for system, Flatpak and Distrobox updates once a week
# (Sunday morning, or at next boot if the PC was off) instead of several
# times a day, to save data. Update now any time with: ujust update
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnUnitActiveSec=
OnCalendar=
OnCalendar=Sun *-*-* 10:00:00
Persistent=true
RandomizedDelaySec=2h
