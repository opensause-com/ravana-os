name: Build Ravana OS installer ISO

# Manual only: an ISO is ~8 GB, so build one when you actually need to install.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Which variant
        type: choice
        options: [ravana-os, ravana-os-nvidia]
        default: ravana-os

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Prepare config
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=ghcr.io/$OWNER/${{ inputs.image }}:latest" >> "$GITHUB_ENV"
          sed "s|@IMAGE_REF@|ghcr.io/$OWNER/${{ inputs.image }}:latest|" disk_config/iso.toml > /tmp/iso.toml
          cat /tmp/iso.toml

      - name: Build ISO
        run: |
          mkdir -p output
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE_REF"
          # Bazzite ships without the Fedora base repos, but bootc-image-builder
          # depsolves the installer (grub, anaconda, ...) from the image's repos.
          # Add them in a throwaway layer used only as the ISO payload; the
          # kickstart switches installed systems to the real image afterwards.
          sudo podman build -t localhost/ravana-iso-src:latest --build-arg BASE="$IMAGE_REF" -f - . <<'CF'
          ARG BASE
          FROM ${BASE}
          COPY disk_config/fedora-base.repo /var/tmp/fedora-base.repo
          COPY disk_config/add-fedora-repos.sh /var/tmp/add-fedora-repos.sh
          RUN bash /var/tmp/add-fedora-repos.sh
          CF
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v /tmp/iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --use-librepo=True localhost/ravana-iso-src:latest
          sudo chown -R "$(id -u):$(id -g)" output
          mv output/bootiso/install.iso "output/${{ inputs.image }}.iso"
          (cd output && sha256sum "${{ inputs.image }}.iso" > "${{ inputs.image }}.iso.sha256")
          ls -lh output

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.image }}-iso
          path: |
            output/${{ inputs.image }}.iso
            output/${{ inputs.image }}.iso.sha256
          compression-level: 0
          retention-days: 7
