name: Publish ISO to SourceForge

# Sends ISOs from an earlier "Build Ravana OS live ISO" run to SourceForge without rebuilding.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID of the live ISO build (the number in its URL)
        required: true
      channel:
        description: Folder on SourceForge
        type: choice
        options: [testing, latest]
        default: testing

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-live-iso'
          merge-multiple: true
          path: output
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: |
          ls -lh output
          cd output && sha256sum -c *.sha256

      - name: Upload to SourceForge
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
          SF_USER: ${{ vars.SF_USER }}
          SF_PROJECT: ${{ vars.SF_PROJECT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          CHANNEL_IN: ${{ inputs.channel }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number"; exit 1; }
          STAMP="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.created_at[0:10]' | tr -d -)"
          scripts/sourceforge-upload.sh "$CHANNEL_IN" "$STAMP" output/*-live.iso
